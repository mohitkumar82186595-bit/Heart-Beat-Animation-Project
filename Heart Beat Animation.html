<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart Beat Animation</title>
<style>
    *{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#050505;
overflow:hidden;
font-family:sans-serif;
}

.container{
position:relative;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
}

/* ECG */

.ecg{
position:absolute;
width:100%;
opacity:.35;
}

svg{
width:100%;
height:140px;
fill:none;
stroke:#ff1744;
stroke-width:5;
stroke-linejoin:round;
stroke-linecap:round;
}

polyline{
stroke-dasharray:1500;
stroke-dashoffset:1500;
animation:line 2.2s linear infinite;
}

@keyframes line{

to{
stroke-dashoffset:0;
}

}

/* Heart */

.heart{
position:relative;
width:150px;
height:150px;
background:#ff1744;
transform:rotate(-45deg);
animation:beat .9s infinite;
box-shadow:
0 0 30px #ff1744,
0 0 60px #ff1744;
}

.heart::before,
.heart::after{
content:"";
position:absolute;
width:150px;
height:150px;
background:#ff1744;
border-radius:50%;
}

.heart::before{
top:-75px;
left:0;
}

.heart::after{
left:75px;
top:0;
}

@keyframes beat{

0%,100%{
transform:rotate(-45deg) scale(1);
}

15%{
transform:rotate(-45deg) scale(1.18);
}

30%{
transform:rotate(-45deg) scale(.95);
}

45%{
transform:rotate(-45deg) scale(1.22);
}

60%{
transform:rotate(-45deg) scale(1);
}

}

/* Particles */

.particle{
position:absolute;
width:8px;
height:8px;
border-radius:50%;
background:#ff4d6d;
pointer-events:none;
box-shadow:0 0 10px #ff1744;
}
</style>
</head>
<body>

<div class="container">

    <div class="ecg">
        <svg viewBox="0 0 1000 120">
            <polyline
            points="
            0,60
            120,60
            180,60
            220,25
            250,95
            280,20
            320,60
            420,60
            520,60
            560,30
            590,100
            620,20
            660,60
            1000,60"/>
        </svg>
    </div>

    <div class="heart"></div>

    <div id="particles"></div>

</div>

<script>
    const container=document.getElementById("particles");

function createParticle(){

const p=document.createElement("div");

p.className="particle";

const x=window.innerWidth/2;
const y=window.innerHeight/2;

p.style.left=x+"px";
p.style.top=y+"px";

container.appendChild(p);

const angle=Math.random()*Math.PI*2;
const distance=120+Math.random()*120;

const dx=Math.cos(angle)*distance;
const dy=Math.sin(angle)*distance;

let start=null;

function animate(t){

if(!start)start=t;

let progress=(t-start)/1200;

p.style.transform=
`translate(${dx*progress}px,${dy*progress}px)
scale(${1-progress})`;

p.style.opacity=1-progress;

if(progress<1){

requestAnimationFrame(animate);

}
else{

p.remove();

}

}

requestAnimationFrame(animate);

}

setInterval(createParticle,120);
</script>

</body>
</html>
